version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    main: ./cmd/dotset
    binary: dotset
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/henrique/dotset/internal/buildinfo.Version={{.Tag}} -X github.com/henrique/dotset/internal/buildinfo.Commit={{.ShortCommit}} -X github.com/henrique/dotset/internal/buildinfo.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
